esphome:
  name: abus-socket-example
  friendly_name: "ABUS Socket ESP32 Example"

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

# WiFi-Konfiguration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Manuelle IP optional
  manual_ip:
    static_ip: 192.168.1.100
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  
  # Fallback Hotspot
  ap:
    ssid: "${friendly_name} Fallback"
    password: "12345678"

captive_portal:

# API für Home Assistant
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Logging
logger:
  level: DEBUG

# External Components für ABUS Socket
external_components:
  - source:
      type: git
      url: https://github.com/killer0071234/abus-esphome-lib
      ref: main

# ABUS Socket Konfiguration
abus_socket:
  id: my_abus_socket
  # Empfangskonfiguration
  socket_receive:
    socket_id: 1
    num_bit: 8    # 8 Bits empfangen
    num_int: 4    # 4 Integer empfangen
    num_long: 2   # 2 Long-Werte empfangen
    num_real: 3   # 3 Real-Werte (Floats) empfangen

# Sensoren für empfangene Daten
sensor:
  # Integer-Sensoren (16-bit)
  - platform: template
    name: "ABUS Int Value 1"
    id: abus_int_1
    accuracy_decimals: 0
    unit_of_measurement: ""
    
  - platform: template
    name: "ABUS Int Value 2" 
    id: abus_int_2
    accuracy_decimals: 0
    unit_of_measurement: ""
    
  # Long-Sensoren (32-bit)
  - platform: template
    name: "ABUS Long Value 1"
    id: abus_long_1
    accuracy_decimals: 0
    unit_of_measurement: ""
    
  # Real-Sensoren (Float)
  - platform: template
    name: "ABUS Temperature"
    id: abus_temp
    accuracy_decimals: 1
    unit_of_measurement: "°C"
    device_class: temperature
    
  - platform: template
    name: "ABUS Humidity"
    id: abus_humidity
    accuracy_decimals: 1
    unit_of_measurement: "%"
    device_class: humidity
    
  - platform: template
    name: "ABUS Pressure"
    id: abus_pressure
    accuracy_decimals: 2
    unit_of_measurement: "hPa"
    device_class: pressure

# Binäre Sensoren für Bit-Werte
binary_sensor:
  - platform: template
    name: "ABUS Bit 0"
    id: abus_bit_0
    
  - platform: template
    name: "ABUS Bit 1"
    id: abus_bit_1
    
  - platform: template
    name: "ABUS Alarm"
    id: abus_alarm
    device_class: problem
    
  - platform: template
    name: "ABUS Status OK"
    id: abus_status_ok
    device_class: connectivity

# Schalter für Ausgänge
switch:
  - platform: template
    name: "ABUS Output 1"
    id: abus_output_1
    turn_on_action:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 1
          bits: [1, 0, 0, 0, 0, 0, 0, 0]  # Bit 0 auf 1 setzen
    turn_off_action:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 1
          bits: [0, 0, 0, 0, 0, 0, 0, 0]  # Bit 0 auf 0 setzen
          
  - platform: template
    name: "ABUS Relay"
    id: abus_relay
    turn_on_action:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 1
          bits: [0, 1, 0, 0, 0, 0, 0, 0]  # Bit 1 auf 1 setzen
    turn_off_action:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 1
          bits: [0, 0, 0, 0, 0, 0, 0, 0]  # Bit 1 auf 0 setzen

# Number-Komponente für Sollwerte
number:
  - platform: template
    name: "ABUS Setpoint Temperature"
    id: abus_setpoint_temp
    min_value: 10.0
    max_value: 30.0
    step: 0.5
    initial_value: 20.0
    unit_of_measurement: "°C"
    mode: slider
    set_action:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 37
          reals: !lambda |-
            return {x, 0.0, 0.0};  // x ist der eingestellte Wert

# Button für manuelle Aktionen
button:
  - platform: template
    name: "Send ABUS Test Data"
    id: send_test_data
    on_press:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 1
          bits: [1, 1, 0, 0, 0, 0, 0, 0]
          ints: [123, 456, 789, 0]
          longs: [123456, 789012]
          reals: [25.5, 60.2, 1013.25]
          
  - platform: template
    name: "Reset ABUS Values"
    id: reset_values
    on_press:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 1
          bits: [0, 0, 0, 0, 0, 0, 0, 0]
          ints: [0, 0, 0, 0]
          longs: [0, 0]
          reals: [0.0, 0.0, 0.0]

# Automatisierungen
interval:
  # Zyklisches Senden alle 30 Sekunden
  - interval: 30s
    then:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 1
          bits: !lambda |-
            // Dynamische Bit-Berechnung
            std::vector<uint8_t> bits(8, 0);
            bits[0] = id(abus_output_1).state ? 1 : 0;
            bits[1] = id(abus_relay).state ? 1 : 0;
            return bits;
          ints: [1, 2, 3, 4]
          longs: [12345, 67890]
          reals: !lambda |-
            return {
              id(abus_setpoint_temp).state,  // Solltemperatur
              (float)millis() / 1000.0f,     // Uptime in Sekunden
              3.14159f                       // Konstanter Wert
            };

# Time-Komponente für zeitbasierte Aktionen
time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: Europe/Berlin
    on_time:
      # Jeden Tag um 12:00 Uhr
      - hours: 12
        minutes: 0
        then:
          - abus_socket.send_data:
              id: my_abus_socket
              socket_id: 1
              bits: [1, 1, 1, 1, 0, 0, 0, 0]  # Mittags-Signal