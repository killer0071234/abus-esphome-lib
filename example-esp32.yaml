substitutions:
  name: abus-socket-example
  friendly_name: "ABUS Socket ESP32 Example"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Optional static IP
  manual_ip:
    static_ip: 192.168.1.100
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  
  # Fallback hotspot
  ap:
    ssid: "${name} Fallback"
    password: "12345678"

captive_portal:

# API for Home Assistant
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # Uses the API encryption key
    encryption:
      key: !secret api_encryption_key

# Logging
logger:
  level: DEBUG

# External components for ABUS Socket
external_components:
  - source:
      type: git
      url: https://github.com/killer0071234/abus-esphome-lib
      ref: main

# ABUS Socket configuration
abus_socket:
  id: my_abus_socket
  # Receive configuration: one entry per socket
  socket_receive:
    # Fixed order (all bits, then ints, longs, reals):
    # index 0-7 = bits, 8-11 = ints, 12-13 = longs, 14-16 = reals
    - socket_id: 1
      num_bit: 8    # receive 8 bits
      num_int: 4    # receive 4 integers
      num_long: 2   # receive 2 long values
      num_real: 3   # receive 3 real values (floats)

    # Free order of data types: index = position in the layout
    - socket_id: 2
      layout: [bit, real, bit, int, int, long, int]

# Sensors for received data (int, long and real values)
sensor:
  # Integer sensors (16-bit)
  - platform: abus_socket
    name: "ABUS Int Value 1"
    id: abus_int_1
    socket_id: 1
    index: 8
    accuracy_decimals: 0

  - platform: abus_socket
    name: "ABUS Int Value 2"
    id: abus_int_2
    socket_id: 1
    index: 9
    accuracy_decimals: 0

  # Long sensors (32-bit)
  - platform: abus_socket
    name: "ABUS Long Value 1"
    id: abus_long_1
    socket_id: 1
    index: 12
    accuracy_decimals: 0

  # Real sensors (float)
  - platform: abus_socket
    name: "ABUS Temperature"
    id: abus_temp
    socket_id: 1
    index: 14
    accuracy_decimals: 1
    unit_of_measurement: "°C"
    device_class: temperature

  - platform: abus_socket
    name: "ABUS Humidity"
    id: abus_humidity
    socket_id: 1
    index: 15
    accuracy_decimals: 1
    unit_of_measurement: "%"
    device_class: humidity

  - platform: abus_socket
    name: "ABUS Pressure"
    id: abus_pressure
    socket_id: 1
    index: 16
    accuracy_decimals: 2
    unit_of_measurement: "hPa"
    device_class: pressure

  # Values of socket 2 (free order)
  - platform: abus_socket
    name: "ABUS Mixed Real"
    socket_id: 2
    index: 1
    accuracy_decimals: 1

  - platform: abus_socket
    name: "ABUS Mixed Long"
    socket_id: 2
    index: 5
    accuracy_decimals: 0

# Binary sensors for bit values
binary_sensor:
  - platform: abus_socket
    name: "ABUS Bit 0"
    id: abus_bit_0
    socket_id: 1
    index: 0

  - platform: abus_socket
    name: "ABUS Bit 1"
    id: abus_bit_1
    socket_id: 1
    index: 1

  - platform: abus_socket
    name: "ABUS Alarm"
    id: abus_alarm
    socket_id: 1
    index: 2
    device_class: problem

  - platform: abus_socket
    name: "ABUS Status OK"
    id: abus_status_ok
    socket_id: 1
    index: 3
    device_class: connectivity

  - platform: abus_socket
    name: "ABUS Mixed Bit"
    socket_id: 2
    index: 0

# Switches for outputs
switch:
  - platform: template
    name: "ABUS Output 1"
    id: abus_output_1
    turn_on_action:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 1
          bits: [1, 0, 0, 0, 0, 0, 0, 0]  # set bit 0 to 1
    turn_off_action:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 1
          bits: [0, 0, 0, 0, 0, 0, 0, 0]  # set bit 0 to 0
          
  - platform: template
    name: "ABUS Relay"
    id: abus_relay
    turn_on_action:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 1
          bits: [0, 1, 0, 0, 0, 0, 0, 0]  # set bit 1 to 1
    turn_off_action:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 1
          bits: [0, 0, 0, 0, 0, 0, 0, 0]  # set bit 1 to 0

# Number component for setpoints
number:
  - platform: template
    name: "ABUS Setpoint Temperature"
    id: abus_setpoint_temp
    min_value: 10.0
    max_value: 30.0
    step: 0.5
    initial_value: 20.0
    unit_of_measurement: "°C"
    mode: slider
    set_action:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 37
          reals: !lambda |-
            return {x, 0.0, 0.0};  // x is the selected value

# Buttons for manual actions
button:
  - platform: template
    name: "Send ABUS Test Data"
    id: send_test_data
    on_press:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 1
          bits: [1, 1, 0, 0, 0, 0, 0, 0]
          ints: [123, 456, 789, 0]
          longs: [123456, 789012]
          reals: [25.5, 60.2, 1013.25]
          
  - platform: template
    name: "Reset ABUS Values"
    id: reset_values
    on_press:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 1
          bits: [0, 0, 0, 0, 0, 0, 0, 0]
          ints: [0, 0, 0, 0]
          longs: [0, 0]
          reals: [0.0, 0.0, 0.0]

  # Free order of data types: the values are sent exactly in this order
  - platform: template
    name: "Send ABUS Mixed Data"
    id: send_mixed_data
    on_press:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 2
          values:
            - bit: !lambda return id(abus_output_1).state;
            - real: !lambda return id(abus_setpoint_temp).state;
            - bit: false
            - int: 123
            - int: -456
            - long: 123456
            - int: !lambda return millis() / 1000;

# Automations
interval:
  # Send cyclically every 30 seconds
  - interval: 30s
    then:
      - abus_socket.send_data:
          id: my_abus_socket
          socket_id: 1
          bits: !lambda |-
            // Compute bits dynamically
            std::vector<uint8_t> bits(8, 0);
            bits[0] = id(abus_output_1).state ? 1 : 0;
            bits[1] = id(abus_relay).state ? 1 : 0;
            return bits;
          ints: [1, 2, 3, 4]
          longs: [12345, 67890]
          reals: !lambda |-
            return {
              id(abus_setpoint_temp).state,  // Setpoint temperature
              (float)millis() / 1000.0f,     // Uptime in seconds
              3.14159f                       // Constant value
            };

# Time component for time-based actions
time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: Europe/Berlin
    on_time:
      # Every day at 12:00
      - hours: 12
        minutes: 0
        then:
          - abus_socket.send_data:
              id: my_abus_socket
              socket_id: 1
              bits: [1, 1, 1, 1, 0, 0, 0, 0]  # Noon signal