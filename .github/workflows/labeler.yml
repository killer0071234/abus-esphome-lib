name: Labeler

on:
  # pull_request_target so labels can also be set on PRs from forks;
  # this workflow never checks out or runs code from the PR
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
