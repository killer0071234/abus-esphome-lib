name: Feature request
description: Suggest a new feature or an improvement for the abus_socket component
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe the use case, not only the solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what is missing or hard today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Example YAML configuration is welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: PLC / controller type, socket definitions, links to protocol documentation, ...
